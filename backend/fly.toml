app = 'smart-meat-api'
primary_region = 'sjc'

[build]

[env]
  CORS_ORIGINS = '["https://smart-meat-web.fly.dev"]'
  FRONTEND_URL = 'https://smart-meat-web.fly.dev'
  GOOGLE_REDIRECT_URI = 'https://smart-meat-api.fly.dev/api/auth/callback'
  CLAUDE_MODEL = 'claude-sonnet-4-5-20250514'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
