app = 'smart-meat-web'
primary_region = 'sjc'

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = 'https://smart-meat-api.fly.dev'

[env]
  NODE_ENV = 'production'
  NEXT_TELEMETRY_DISABLED = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
